<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Watchlist</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #5f6ee6, #7a49bd);
            min-height: 100vh;
            color: #1f2937;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 28px 20px 50px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 28px;
        }

        .header h1 {
            margin: 0;
            font-size: 34px;
            font-weight: 700;
        }

        .header p {
            margin-top: 8px;
            font-size: 15px;
            opacity: 0.9;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
            overflow: hidden;
            margin-bottom: 26px;
        }

        .add-card {
            padding: 28px;
        }

        .info-box {
            background: #eef4fb;
            border-left: 4px solid #6f7df1;
            border-radius: 8px;
            padding: 13px 15px;
            margin-bottom: 22px;
            color: #5b6473;
            font-size: 14px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #4b5563;
            text-transform: uppercase;
        }

        .form-row {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .ticker-input {
            flex: 1;
            height: 48px;
            padding: 0 15px;
            border: 1px solid #d8deea;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        .ticker-input:focus {
            border-color: #6f7df1;
            box-shadow: 0 0 0 3px rgba(111, 125, 241, 0.15);
        }

        .add-button {
            height: 48px;
            padding: 0 24px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(90deg, #6877ef, #8747b8);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(106, 88, 200, 0.25);
        }

        .add-button:hover {
            opacity: 0.95;
        }

        .add-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 8px;
            background: #f3f4f6;
            color: #374151;
            display: none;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
        }

        .message.info {
            display: block;
            background: #eff6ff;
            color: #1d4ed8;
        }

        .watchlist-header {
            padding: 20px 26px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 20px;
            font-weight: 700;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8fafc;
        }

        th {
            padding: 15px 18px;
            text-align: left;
            color: #6b7280;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 17px 18px;
            border-bottom: 1px solid #edf0f4;
            font-size: 14px;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: #fafbff;
        }

        .symbol {
            font-weight: 700;
            color: #5d6ee8;
        }

        .price {
            font-weight: 700;
            color: #159447;
        }

        .delete-button {
            border: none;
            background: #ff7676;
            color: white;
            padding: 8px 13px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #ef5b5b;
        }

        .empty-state {
            text-align: center;
            padding: 36px;
            color: #6b7280;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        @media (max-width: 720px) {
            .header h1 {
                font-size: 28px;
            }

            .form-row {
                flex-direction: column;
                align-items: stretch;
            }

            .add-button {
                width: 100%;
            }

            th,
            td {
                padding: 12px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="container">

            <div class="header">
                <h1>📈 Stock Watchlist</h1>
                <p>Track your favorite stocks with the latest available price</p>
            </div>

            <div class="card add-card">
                <div class="info-box">
                    💡 Enter a single ticker symbol to fetch the latest price and add it to your personalized watchlist.
                </div>

                <label class="form-label" for="symbol">
                    Ticker Symbol
                </label>

                <div class="form-row">
                    <input
                        type="text"
                        id="symbol"
                        class="ticker-input"
                        placeholder="e.g., AAPL, TSLA, MSFT"
                        autocomplete="off"
                    >

                    <button
                        id="addButton"
                        class="add-button"
                    >
                        Add to Watchlist
                    </button>
                </div>

                <div id="message" class="message"></div>
            </div>

            <div class="card">
                <div class="watchlist-header">
                    My Watchlist
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Email</th>
                                <th>Latest Price</th>
                                <th>Last Updated</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="watchlistBody">
                        </tbody>
                    </table>

                    <div id="emptyState" class="empty-state" style="display:none;">
                        No stocks in your watchlist yet.
                    </div>

                    <div id="loadingState" class="loading">
                        Loading watchlist...
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const symbolInput = document.getElementById("symbol");
        const addButton = document.getElementById("addButton");
        const message = document.getElementById("message");
        const watchlistBody = document.getElementById("watchlistBody");
        const emptyState = document.getElementById("emptyState");
        const loadingState = document.getElementById("loadingState");


        function showMessage(text, type = "info") {
            message.textContent = text;
            message.className = "message " + type;
        }


        function clearMessage() {
            message.textContent = "";
            message.className = "message";
        }


        function formatPrice(value) {
            if (value === null || value === undefined || value === "") {
                return "";
            }

            const number = Number(value);

            if (Number.isNaN(number)) {
                return value;
            }

            return "$" + number.toFixed(2);
        }


        function formatDate(value) {
            if (!value) {
                return "";
            }

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleString();
        }


        async function loadWatchlist() {
            loadingState.style.display = "block";
            emptyState.style.display = "none";
            watchlistBody.innerHTML = "";

            try {
                const response = await fetch("/watchlist");
                const data = await response.json();

                if (!response.ok) {
                    showMessage(
                        "Error loading watchlist: " +
                        (data.error || "Unknown error"),
                        "error"
                    );
                    return;
                }

                if (!Array.isArray(data) || data.length === 0) {
                    emptyState.style.display = "block";
                    return;
                }

                data.forEach(row => {
                    const tr = document.createElement("tr");

                    const symbolCell = document.createElement("td");
                    symbolCell.className = "symbol";
                    symbolCell.textContent = row.symbol;

                    const emailCell = document.createElement("td");
                    emailCell.textContent = row.email;

                    const priceCell = document.createElement("td");
                    priceCell.className = "price";
                    priceCell.textContent = formatPrice(row.latest_price);

                    const updatedCell = document.createElement("td");
                    updatedCell.textContent = formatDate(row.updated_at);

                    const actionCell = document.createElement("td");

                    const deleteButton = document.createElement("button");
                    deleteButton.className = "delete-button";
                    deleteButton.textContent = "Delete";

                    deleteButton.addEventListener(
                        "click",
                        () => deleteStock(row.symbol)
                    );

                    actionCell.appendChild(deleteButton);

                    tr.appendChild(symbolCell);
                    tr.appendChild(emailCell);
                    tr.appendChild(priceCell);
                    tr.appendChild(updatedCell);
                    tr.appendChild(actionCell);

                    watchlistBody.appendChild(tr);
                });

            } catch (error) {
                showMessage(
                    "Error loading watchlist: " + error.message,
                    "error"
                );

            } finally {
                loadingState.style.display = "none";
            }
        }


        async function addStock() {
            const symbol = symbolInput.value
                .trim()
                .toUpperCase();

            if (!symbol) {
                showMessage(
                    "Please enter a ticker symbol.",
                    "error"
                );
                return;
            }

            addButton.disabled = true;

            showMessage(
                `Fetching latest price for ${symbol}...`,
                "info"
            );

            try {
                const response = await fetch(
                    "/watchlist",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            symbol: symbol
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    showMessage(
                        "Error: " +
                        (data.error || "Unable to add stock"),
                        "error"
                    );
                    return;
                }

                showMessage(
                    `Added ${data.symbol} at price ${formatPrice(data.latest_price)}`,
                    "success"
                );

                symbolInput.value = "";

                await loadWatchlist();

            } catch (error) {
                showMessage(
                    "Error: " + error.message,
                    "error"
                );

            } finally {
                addButton.disabled = false;
            }
        }


        async function deleteStock(symbol) {
            const confirmed = window.confirm(
                `Delete ${symbol} from your watchlist?`
            );

            if (!confirmed) {
                return;
            }

            showMessage(
                `Removing ${symbol}...`,
                "info"
            );

            try {
                const response = await fetch(
                    `/watchlist/${encodeURIComponent(symbol)}`,
                    {
                        method: "DELETE"
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    showMessage(
                        "Error: " +
                        (data.error || "Unable to remove stock"),
                        "error"
                    );
                    return;
                }

                showMessage(
                    `${symbol} removed from watchlist.`,
                    "success"
                );

                await loadWatchlist();

            } catch (error) {
                showMessage(
                    "Error removing stock: " + error.message,
                    "error"
                );
            }
        }


        addButton.addEventListener(
            "click",
            addStock
        );


        symbolInput.addEventListener(
            "keydown",
            function(event) {
                if (event.key === "Enter") {
                    addStock();
                }
            }
        );


        loadWatchlist();
    </script>
</body>
</html>
